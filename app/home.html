<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>csv</title>
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="stylesheet" href="style.css">
  <script>
    (function() {
      try {
        const theme = localStorage.getItem('theme') || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'nord' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (err) { console.warn('Theme preference init failed:', err); }
    })();
  </script>
</head>

<body id="body" class="flex-col">
  <header id="header"></header>
  <div id="content" class="flex-main">
    <div id="main-container"></div>
    <ui-validation-pane id="validation-pane"></ui-validation-pane>
  </div>
  <footer>
    <section id="footer">
      <section id="footer-left">Left</section>
      <section id="footer-center" class="flex-main">Center</section>
      <section id="footer-right">Right</section>
      <span id="lock" class="icon" role="img" aria-label="editing file" data-src="edit_square"></span>
    </section>
  </footer>
  <section id="dialog" class="scroll"></section>
  <ui-command-palette id="palette"></ui-command-palette>
  <script type="module" src="js/main.js"></script>
</body>

</html>
